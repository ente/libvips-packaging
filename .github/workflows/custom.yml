name: Standalone CLI

on:
  workflow_dispatch:
  push:
    branches: [main, 'np/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build standalone CLI
        run: ./build-cli.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vips-${{ matrix.arch }}
          path: vips-${{ matrix.arch }}
          if-no-files-found: error

  windows:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ente/build-win64-mxe
          ref: bacfe327b4b1cbb447e615bf7155802957c82039
      - name: Build standalone CLI
        run: ./build-cli.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vips-${{ matrix.arch }}.exe
          path: output/vips-${{ matrix.arch }}.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vips-*
          merge-multiple: true
      - name: Create draft release
        uses: ncipollo/release-action@v1
        with:
          artifacts: vips-x64,vips-arm64,vips-x86_64.exe,vips-aarch64.exe
          draft: true
          allowUpdates: true
          updateOnlyUnreleased: true
